<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Complaint - Smart Complaint Management System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    input, select { padding: .55rem; font-size: 1rem; } button { padding: .55rem 1rem; font-size: 1rem; cursor: pointer; }
    .err { color: #b91c1c; } .badge { display: inline-block; padding: .15rem .55rem; border-radius: 999px; background: #e0e7ff; font-weight: 600; }
    ol.timeline { list-style: none; padding-left: 1rem; border-left: 3px solid #c7d2fe; }
    ol.timeline li { margin: 0 0 1rem 0; position: relative; padding-left: .8rem; }
    ol.timeline li::before { content: ""; position: absolute; left: -1.55rem; top: .3rem; width: .8rem; height: .8rem; border-radius: 50%; background: #2563eb; }
    .when { color: #555; font-size: .9rem; } .card { border: 1px solid #ddd; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; }
    .ok { color: #15803d; font-weight: 600; } ul.files { padding-left: 1.2rem; } ul.files li { margin: .3rem 0; }
    .stars { display: inline-flex; flex-direction: row-reverse; gap: .1rem; } .stars input { display: none; }
    .stars label { font-size: 1.8rem; color: #ccc; cursor: pointer; } .stars input:checked ~ label,
    .stars label:hover, .stars label:hover ~ label { color: #f59e0b; }
    textarea { width: 100%; font: inherit; padding: .5rem; box-sizing: border-box; } .row { margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>Track a Complaint</h1>
  <input id="ticket" placeholder="SCMS-YYYYMMDD-NNNNN" size="24"> <button id="go">Track</button>
  <div id="mine"></div>
  <p id="msg" class="err"></p>
  <div id="out"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const token = localStorage.getItem("scms_token");
    if (!token) location.href = "/login";
    const H = { Authorization: `Bearer ${token}` };
    const user = JSON.parse(localStorage.getItem("scms_user") || "null");
    const staff = user && ["agent", "supervisor", "admin"].includes(user.role);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.ceil(n / 1024)} KB`);

    function evidenceHtml(c) {
      const files = c.evidence || [];
      const list = files.length ? `<ul class="files">${files.map((e) => `
          <li><a href="#" data-ev="${esc(e.id)}" data-name="${esc(e.filename)}">${esc(e.filename)}</a> (${kb(e.size)})<br>
              <span class="when">${new Date(e.uploaded_at).toLocaleString()} &middot; by ${esc(e.uploaded_by_name)}</span></li>`).join("")}</ul>`
        : `<p class="when">No evidence attached yet.</p>`;
      const form = staff && c.status !== "Closed" ? `
          <form id="evForm"><input id="evFiles" type="file" accept="application/pdf,image/jpeg,image/png" multiple>
            <button type="submit">Upload evidence</button> <span class="when">PDF, JPEG or PNG, max 10 MB each</span></form>
          <p id="evMsg"></p>` : "";
      return `<h3>Evidence</h3>${list}${form}`;
    }

    function bindEvidence(c) {
      document.querySelectorAll("[data-ev]").forEach((a) => (a.onclick = async (e) => {
        e.preventDefault();
        const r = await fetch(`/complaints/${encodeURIComponent(c.id)}/evidence/${encodeURIComponent(a.dataset.ev)}`, { headers: H });
        if (!r.ok) { $("msg").textContent = (await r.json()).error; return; }
        const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(await r.blob()), download: a.dataset.name });
        link.click(); URL.revokeObjectURL(link.href);
      }));
      if (!$("evForm")) return;
      $("evForm").onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData();
        for (const f of $("evFiles").files) fd.append("files", f);
        const r = await fetch(`/complaints/${encodeURIComponent(c.id)}/evidence`, { method: "POST", headers: H, body: fd });
        const d = await r.json();
        if (!r.ok) { $("evMsg").textContent = d.error; $("evMsg").className = "err"; return; }
        await track(c.id);
        $("evMsg").textContent = `${d.length} file(s) uploaded.`; $("evMsg").className = "ok";
      };
    }

    const WINDOW_DAYS = 7;
    function feedbackHtml(c) {   // Sprint 3 Task 2: rate (closes), close without rating, or reopen
      if (c.feedback) return `<h3>Your feedback</h3><p>${"&#9733;".repeat(c.feedback.rating)}${"&#9734;".repeat(5 - c.feedback.rating)}
          ${c.feedback.comment ? ` &mdash; ${esc(c.feedback.comment)}` : ""}</p>`;
      if (c.auto_closed) return `<p class="when">Closed automatically: no feedback was given within ${WINDOW_DAYS} days.</p>`;
      if (!user || user.role !== "citizen" || c.status !== "Resolved") return "";
      const resolved = (c.history || []).filter((h) => h.status === "Resolved").pop();
      const ends = new Date(new Date(resolved.at).getTime() + WINDOW_DAYS * 864e5);
      return `<h3>Rate the resolution</h3>
        ${c.resolution ? `<p><strong>Resolution:</strong> ${esc(c.resolution.notes)}</p>` : ""}
        <form id="fbForm">
          <div class="stars">${[5, 4, 3, 2, 1].map((n) => `<input type="radio" name="rating" id="r${n}" value="${n}">
            <label for="r${n}" title="${n} star${n > 1 ? "s" : ""}">&#9733;</label>`).join("")}</div>
          <div class="row"><textarea id="fbComment" maxlength="500" rows="3" placeholder="Optional comment (max 500 characters)"></textarea></div>
          <button type="submit">Submit rating and close</button>
          <span class="when">Rate by ${ends.toLocaleString()}; after that it closes automatically.</span>
        </form>
        <p class="row"><button id="closeBtn" type="button">Close without rating</button>
          <button id="reopenBtn" type="button">Reopen (not fixed)</button></p>
        <p id="fbMsg"></p>`;
    }

    function bindFeedback(c) {
      if (!$("fbForm")) return;
      const fail = (m) => { $("fbMsg").textContent = m; $("fbMsg").className = "err"; };
      $("fbForm").onsubmit = async (e) => {
        e.preventDefault();
        const picked = document.querySelector("input[name=rating]:checked");
        if (!picked) return fail("Choose a rating from 1 to 5 stars.");
        const r = await fetch(`/complaints/${encodeURIComponent(c.id)}/feedback`, { method: "POST",
          headers: { ...H, "Content-Type": "application/json" },
          body: JSON.stringify({ rating: Number(picked.value), comment: $("fbComment").value }) });
        if (!r.ok) return fail((await r.json()).error);
        await track(c.id); loadMine();
      };
      const move = async (status, note) => {
        const r = await fetch(`/complaints/${encodeURIComponent(c.id)}/status`, { method: "PATCH",
          headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify({ status, note }) });
        if (!r.ok) return fail((await r.json()).error);
        await track(c.id); loadMine();
      };
      $("closeBtn").onclick = () => move("Closed", "Closed by citizen without rating");
      $("reopenBtn").onclick = () => {
        const why = prompt("What is still wrong?");
        if (why !== null) move("In Progress", why.trim() || "Reopened by citizen");
      };
    }

    async function track(id) {
      $("msg").textContent = ""; $("out").innerHTML = "";
      const r = await fetch(`/complaints/${encodeURIComponent(id)}`, { headers: H });
      const c = await r.json();
      if (!r.ok) { $("msg").textContent = c.error; return; }
      $("out").innerHTML = `
        <div class="card">
          <strong>${esc(c.id)}</strong> &mdash; ${esc(c.title)} <span class="badge">${esc(c.status)}</span>${c.escalated ? ` <span class="badge">Escalated</span>` : ""}<br>
          <span class="when">${esc(c.category)} &middot; ${esc(c.department)} &middot; Severity: ${esc(c.severity)}</span>
        </div>
        <h3>Timeline</h3>
        <ol class="timeline">${(c.history || []).map((h) => `
          <li><strong>${esc(h.status)}</strong>${h.note ? ` &mdash; ${esc(h.note)}` : ""}<br>
              <span class="when">${new Date(h.at).toLocaleString()} &middot; by ${esc(h.by)}</span></li>`).join("")}
        </ol>
        ${feedbackHtml(c)}
        ${evidenceHtml(c)}`;
      bindFeedback(c);
      bindEvidence(c);
    }

    $("go").onclick = () => track($("ticket").value.trim());
    async function loadMine() {  // citizens: list their complaints for one-click tracking
      const r = await fetch("/complaints/mine", { headers: H });
      if (!r.ok) return;
      const items = await r.json();
      if (items.length) $("mine").innerHTML = "<h3>My complaints</h3>" + items.map((c) =>
        `<div><a href="#" data-id="${esc(c.id)}">${esc(c.id)}</a> &mdash; ${esc(c.title)} <span class="badge">${esc(c.status)}</span></div>`).join("");
      document.querySelectorAll("[data-id]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); track(a.dataset.id); }));
    }
    loadMine();
  </script>
</body>
</html>
