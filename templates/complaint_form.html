<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Complaint Management System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    label { display: block; margin-top: .8rem; font-weight: 600; }
    input, textarea, select { width: 100%; padding: .55rem; font-size: 1rem; box-sizing: border-box; margin-top: .25rem; }
    textarea { height: 110px; }
    button { padding: .6rem 1.1rem; font-size: 1rem; cursor: pointer; margin-top: .8rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: .7rem 1rem; margin: .5rem 0; }
    .bar { background: #eee; border-radius: 4px; height: 8px; margin-top: .3rem; }
    .bar > div { background: #2563eb; height: 8px; border-radius: 4px; }
    .ok { color: #15803d; font-weight: 600; } .err { color: #b91c1c; }
    .field-err { color: #b91c1c; font-size: .9rem; } .hidden { display: none; }
    .top { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="top"><h1>Submit a Complaint</h1><span id="who"></span></div>

  <label>Title (max 120 characters)<input id="title" maxlength="120"></label>
  <div class="field-err" data-for="title"></div>
  <label>Description<textarea id="description" maxlength="2000" placeholder="Describe your complaint..."></textarea></label>
  <div class="field-err" data-for="description"></div>
  <label>Severity
    <select id="severity"><option value="">Select...</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
  </label>
  <div class="field-err" data-for="severity"></div>
  <label>Photos (up to 5, JPEG/PNG, max 5 MB each)<input id="images" type="file" accept="image/jpeg,image/png" multiple></label>
  <div class="field-err" data-for="images"></div>
  <button id="gpsBtn" type="button">Use my GPS location</button> <span id="gpsText"></span>
  <div class="field-err" data-for="location"></div>

  <button id="suggestBtn">Suggest Category</button>
  <div id="results" class="hidden">
    <h3>Top 3 Suggested Categories</h3>
    <div id="suggestions"></div>
    <h3>Override Category (optional)</h3>
    <select id="categorySelect"></select>
    <div class="field-err" data-for="category"></div>
    <button id="submitBtn">Submit Complaint</button>
  </div>

  <p id="message"></p>
  <script src="/static/js/categorize.js"></script>
</body>
</html>
