<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Smart Complaint Management System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    input { width: 100%; padding: .55rem; margin: .3rem 0 .8rem; font-size: 1rem; box-sizing: border-box; }
    button { padding: .6rem 1.1rem; font-size: 1rem; cursor: pointer; }
    .err { color: #b91c1c; } .ok { color: #15803d; font-weight: 600; }
    .tabs button { margin-right: .4rem; } .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Smart Complaint Management</h1>
  <div class="tabs"><button id="showLogin">Log in</button><button id="showRegister">Register</button></div>
  <form id="loginForm">
    <h2>Log in</h2>
    <label>Email<input id="loginEmail" type="email" required></label>
    <label>Password<input id="loginPassword" type="password" required></label>
    <button type="submit">Log in</button>
  </form>
  <form id="registerForm" class="hidden">
    <h2>Register as a citizen</h2>
    <label>Name<input id="regName" required></label>
    <label>Email<input id="regEmail" type="email" required></label>
    <label>Password (min 8 characters)<input id="regPassword" type="password" minlength="8" required></label>
    <button type="submit">Create account</button>
  </form>
  <p id="msg"></p>
  <script>
    const $ = (id) => document.getElementById(id);
    const show = (login) => { $("loginForm").classList.toggle("hidden", !login); $("registerForm").classList.toggle("hidden", login); };
    $("showLogin").onclick = () => show(true);
    $("showRegister").onclick = () => show(false);
    const say = (text, ok) => { $("msg").textContent = text; $("msg").className = ok ? "ok" : "err"; };
    async function post(url, body) {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return { ok: r.ok, data: await r.json() };
    }
    $("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const { ok, data } = await post("/auth/login", { email: $("loginEmail").value, password: $("loginPassword").value });
      if (!ok) return say(data.error);
      localStorage.setItem("scms_token", data.token);
      localStorage.setItem("scms_user", JSON.stringify(data.user));
      say(`Logged in as ${data.user.name} (${data.user.role}).`, true);
      setTimeout(() => (location.href = "/"), 600);
    };
    $("registerForm").onsubmit = async (e) => {
      e.preventDefault();
      const { ok, data } = await post("/auth/register", { name: $("regName").value, email: $("regEmail").value, password: $("regPassword").value });
      if (!ok) return say(data.error);
      say("Account created. You can log in now.", true); show(true); $("loginEmail").value = data.email;
    };
  </script>
</body>
</html>
