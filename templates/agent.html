<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Workspace - Smart Complaint Management System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    textarea { width: 100%; padding: .55rem; font: inherit; box-sizing: border-box; } button { padding: .45rem .9rem; font-size: .95rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; } td, th { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    tbody tr { cursor: pointer; } tbody tr:hover { background: #f5f7ff; } tr.overdue { background: #fee2e2; } tr.overdue:hover { background: #fecaca; }
    .err { color: #b91c1c; } .ok { color: #15803d; font-weight: 600; } .muted { color: #666; font-size: .85rem; }
    .badge { display: inline-block; padding: .15rem .55rem; border-radius: 999px; background: #e0e7ff; font-weight: 600; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; } .note { border-left: 3px solid #c7d2fe; padding: .3rem .7rem; margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>My Work Queue</h1>
  <label class="muted"><input id="all" type="checkbox"> Show resolved and closed</label>
  <p id="msg" class="err"></p>
  <table><thead><tr><th>Ticket</th><th>Title</th><th>Severity</th><th>Status</th><th>SLA</th></tr></thead><tbody id="queue"></tbody></table>
  <p class="muted">Most urgent first, overdue highlighted. Refreshes every 60 seconds. <span id="stamp"></span></p>
  <div id="detail"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const token = localStorage.getItem("scms_token");
    if (!token) location.href = "/login";
    const H = { Authorization: `Bearer ${token}` };
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const NEXT = { "Assigned": ["In Progress"], "In Progress": ["Pending Info", "Resolved"], "Pending Info": ["In Progress"] };
    const label = (s, prev) => ({ "In Progress": prev === "Pending Info" ? "Resume work" : "Start work",
      "Pending Info": "Ask citizen for info", "Resolved": "Mark resolved" }[s]);
    const dur = (m) => (m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h` : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`);
    const sla = (q) => (["Resolved", "Closed"].includes(q.status) ? "Done" : q.minutes_left === null ? "No SLA"
      : q.minutes_left < 0 ? `Overdue by ${dur(-q.minutes_left)}` : `${dur(q.minutes_left)} left`);
    let current = null;

    async function loadQueue() {
      const r = await fetch(`/agent/complaints${$("all").checked ? "?all=1" : ""}`, { headers: H });
      const d = await r.json();
      if (!r.ok) { $("msg").textContent = d.error; return; }
      $("queue").innerHTML = d.map((q) => `
        <tr class="${q.overdue ? "overdue" : ""}" data-id="${esc(q.id)}"><td>${esc(q.id)}${q.escalated ? ` <span class="badge">Priority</span>` : ""}</td><td>${esc(q.title)}</td>
          <td>${esc(q.severity)}</td><td>${esc(q.status)}</td><td>${sla(q)}</td></tr>`).join("")
        || `<tr><td colspan="5">No complaints assigned to you.</td></tr>`;
      document.querySelectorAll("[data-id]").forEach((tr) => (tr.onclick = () => open(tr.dataset.id)));
      $("stamp").textContent = `Last updated ${new Date().toLocaleTimeString()}`;
    }

    async function open(id) {
      const r = await fetch(`/complaints/${encodeURIComponent(id)}`, { headers: H });
      const c = await r.json();
      if (!r.ok) { $("msg").textContent = c.error; return; }
      current = c;
      const notes = (c.notes || []).map((n) => `<div class="note">${esc(n.text)}<br>
          <span class="muted">${new Date(n.at).toLocaleString()} &middot; ${esc(n.by_name)}</span></div>`).join("");
      $("detail").innerHTML = `
        <div class="card"><strong>${esc(c.id)}</strong> &mdash; ${esc(c.title)} <span class="badge">${esc(c.status)}</span>
          <p>${esc(c.description)}</p>
          <span class="muted">${esc(c.category)} &middot; ${esc(c.department)} &middot; Severity: ${esc(c.severity)}</span></div>
        ${c.escalated ? `<p class="err">Escalated by ${esc(c.escalations.at(-1).by_name)}: ${esc(c.escalations.at(-1).reason)}</p>` : ""}
        ${c.resolution ? `<p class="ok">Resolution: ${esc(c.resolution.notes)}</p>` : ""}
        <h3>Internal notes</h3>${notes || `<p class="muted">No notes yet. Notes are not shown to the citizen.</p>`}
        ${c.status === "Closed" ? "" : `
          <textarea id="text" rows="3" maxlength="2000" placeholder="Internal note, question for the citizen, or resolution notes (action taken)"></textarea>
          <p><button data-note>Add internal note</button>
          ${(NEXT[c.status] || []).map((s) => `<button data-status="${s}">${label(s, c.status)}</button>`).join(" ")}</p>
          <p id="actMsg"></p>`}
        <h3>Timeline</h3>
        <ol>${(c.history || []).map((h) => `<li><strong>${esc(h.status)}</strong>${h.note ? ` &mdash; ${esc(h.note)}` : ""}
          <span class="muted">${new Date(h.at).toLocaleString()}</span></li>`).join("")}</ol>`;
      document.querySelector("[data-note]")?.addEventListener("click", () =>
        send(`/complaints/${encodeURIComponent(c.id)}/notes`, "POST", { text: $("text").value }));
      document.querySelectorAll("[data-status]").forEach((b) => (b.onclick = () => {
        if (b.dataset.status === "Resolved" && !$("text").value.trim()) { say("Describe the action taken before resolving."); return; }
        send(`/complaints/${encodeURIComponent(c.id)}/status`, "PATCH", { status: b.dataset.status, note: $("text").value });
      }));
    }

    function say(text, ok = false) { $("actMsg").textContent = text; $("actMsg").className = ok ? "ok" : "err"; }

    async function send(url, method, body) {
      const r = await fetch(url, { method, headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) { say(d.error); return; }
      await open(current.id); loadQueue();
      if ($("actMsg")) say("Saved.", true);
    }

    $("all").onchange = loadQueue;
    loadQueue(); setInterval(loadQueue, 60000);
  </script>
</body>
</html>
